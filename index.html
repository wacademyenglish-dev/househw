<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOLFFY Mobile HW: House of Gold</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Montserrat:wght@400;700;800;900&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        top: {
                            dark: '#050505',     /* Deep Black */
                            panel: '#121212',    /* Glass Panel */
                            card: '#1a1a1a',     /* Card Bg */
                            yellow: '#FACC15',   /* TØP Yellow */
                            border: '#333333'    /* Subtle border */
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace']
                    },
                    boxShadow: {
                        'neon-yellow': '0 0 15px rgba(250,204,21,0.5), inset 0 0 10px rgba(250,204,21,0.2)',
                        'panel': 'inset 0 2px 10px rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.8)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Base & Resets */
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(250, 204, 21, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.03) 0%, transparent 40%);
            color: #fdfdfd;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* Mobile Wrapper Simulator */
        .mobile-wrapper {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 100vh;
            background-color: #050505;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        
        @media (min-width: 640px) {
            .mobile-wrapper {
                height: 90vh;
                border-radius: 40px;
                border: 8px solid #121212;
                box-shadow: 0 25px 50px -12px rgba(250, 204, 21, 0.15), inset 0 0 0 4px #000;
            }
        }

        /* Custom Scrollbar */
        .mobile-wrapper::-webkit-scrollbar { width: 6px; }
        .mobile-wrapper::-webkit-scrollbar-track { background: #000; }
        .mobile-wrapper::-webkit-scrollbar-thumb { background: #FACC15; border-radius: 10px; }

        /* Card styles */
        .question-card {
            background-color: #121212;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .question-card.active {
            border-color: #FACC15;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.15);
        }

        .option-btn {
            transition: all 0.2s;
            border-left: 4px solid transparent;
            background-color: #1a1a1a;
        }
        .option-btn:hover:not(:disabled) {
            background: rgba(250, 204, 21, 0.1);
            border-left-color: #FACC15;
            transform: translateX(4px);
        }
        .option-btn.correct { background-color: #FACC15 !important; color: #000 !important; border-left-color: #000 !important; font-weight: bold; box-shadow: 0 0 10px rgba(250,204,21,0.5);}
        .option-btn.wrong { background-color: #ef4444 !important; color: white !important; border-left-color: #000 !important; font-weight: bold; box-shadow: 0 0 10px rgba(239,68,68,0.5);}
        .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: #ef4444 !important;}
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }

        .confetti { position: absolute; width: 8px; height: 16px; opacity: 0; z-index: 100; border-radius: 4px;}
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .progress-point { transition: all 0.3s; }
        .progress-point.filled { background-color: #FACC15; box-shadow: 0 0 8px #FACC15; border-color: #FACC15; }

        /* Vinyl Spin */
        .vinyl-spin { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="mobile-wrapper" id="app-container">
        
        <!-- Sticky Header with Progress -->
        <header class="sticky top-0 z-50 bg-top-dark/95 backdrop-blur-md border-b border-top-border px-6 pt-5 pb-3 shadow-md">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="font-display font-black text-top-yellow tracking-widest text-lg uppercase">WOLFFY <span class="text-white">A1</span></h1>
                    <p class="font-mono text-[10px] text-gray-400 uppercase tracking-widest font-bold">HW TAPE • HOUSE OF GOLD</p>
                </div>
                <div class="text-right bg-top-panel px-3 py-1 rounded border border-top-border">
                    <span id="score-counter" class="font-mono text-xs font-bold text-top-yellow tracking-widest uppercase">SCORE: 0/15</span>
                </div>
            </div>
            <!-- Visual Progress Dots -->
            <div class="flex justify-between gap-1 mb-1" id="progress-container">
                <!-- Dots injected via JS -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-4 pb-32 space-y-6">
            
            <!-- Intro Data Disc -->
            <div class="bg-top-panel p-5 rounded-2xl shadow-panel border border-top-border relative overflow-hidden flex flex-col items-center text-center">
                <div class="w-24 h-24 rounded-full border-4 border-top-yellow border-t-transparent animate-spin mb-4 shadow-neon-yellow flex items-center justify-center">
                    <div class="w-20 h-20 rounded-full overflow-hidden vinyl-spin border-2 border-black" style="animation-duration: 3s;">
                        <img src="https://i.scdn.co/image/ab67616d0000b27376e1ebbc8a70c01e3bce7fb7" class="w-full h-full object-cover opacity-90 grayscale">
                    </div>
                </div>

                <div class="w-full bg-[#000] mt-2 p-3 text-center border border-top-border rounded-xl">
                    <h2 class="font-display font-black text-white text-2xl uppercase leading-none tracking-wide">Acoustic Quiz</h2>
                    <p class="font-mono text-xs font-bold text-top-yellow mt-1 uppercase tracking-widest">"WILL" & Promises</p>
                </div>
            </div>

            <!-- Quiz Questions Container -->
            <div id="quiz-container" class="space-y-6 relative z-10">
                <!-- Questions will be injected here -->
            </div>

        </main>

        <!-- Fixed Submit Button Footer -->
        <div class="sticky bottom-0 left-0 w-full bg-gradient-to-t from-[#000] via-top-dark to-transparent pt-12 pb-6 px-6 z-50">
            <button id="submit-btn" onclick="checkAllAndSubmit()" class="w-full bg-top-yellow text-[#000] font-sans font-black text-xl tracking-widest uppercase py-4 rounded-xl shadow-[0_0_20px_rgba(250,204,21,0.3)] transition-all active:scale-95 flex items-center justify-center gap-3 border border-transparent hover:bg-[#000] hover:text-top-yellow hover:border-top-yellow">
                <i class="fa-solid fa-check-double"></i>
                FINISH HOMEWORK
            </button>
        </div>

        <!-- Success Overlay -->
        <div id="success-overlay" class="fixed inset-0 bg-[#000]/95 z-[100] flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 hidden">
            <div class="w-32 h-32 bg-top-panel border-4 border-top-yellow rounded-full flex items-center justify-center mb-6 shadow-neon-yellow transform scale-50 transition-transform duration-500" id="success-badge">
                <span class="text-6xl text-top-yellow">🎸</span>
            </div>
            <h1 class="font-display font-black text-4xl text-white mb-2 text-center uppercase tracking-widest">PROMISE KEPT!</h1>
            <div class="bg-top-panel border border-top-yellow px-6 py-2 rounded-xl mb-6 mt-4">
                <div class="font-sans text-top-yellow text-2xl font-bold tracking-widest" id="final-score">SCORE: 15/15</div>
            </div>
            <p class="font-sans text-gray-400 text-sm mb-10 text-center max-w-[280px]">Your grammar promises are perfect. The teacher is very proud of your progress!</p>
            <button onclick="location.reload()" class="bg-transparent border-2 border-top-yellow text-top-yellow font-sans font-bold px-10 py-4 rounded-full uppercase text-sm tracking-widest hover:bg-top-yellow hover:text-black transition-colors shadow-neon-yellow">REDO CHALLENGE</button>
        </div>

    </div>

    <!-- Scripts -->
    <script>
        const quizData = [
            { q: "1. 'I ______ make you queen.'", a: ["am", "will", "do"], c: 1 },
            { q: "2. We use 'Will' to make a...", a: ["Mistake", "Sandwich", "Promise"], c: 2 },
            { q: "3. '______ you buy me a house of gold?'", a: ["Are", "Do", "Will"], c: 2 },
            { q: "4. What does 'House' mean?", a: ["A place to live.", "A fast car.", "A short song."], c: 0 },
            { q: "5. What is the negative form of 'Will'?", a: ["don't will", "willn't", "won't"], c: 2 },
            { q: "6. 'I will ______ care of you.'", a: ["take", "make", "do"], c: 0 },
            { q: "7. 'Gold' is a...", a: ["Red flower.", "Yellow metal.", "Blue bird."], c: 1 },
            { q: "8. What instrument does the singer play in the video?", a: ["Piano", "Electric Guitar", "Ukulele"], c: 2 },
            { q: "9. A 'Queen' is...", a: ["A very important woman.", "A small dog.", "A beautiful house."], c: 0 },
            { q: "10. 'I ______ put you on the map.'", a: ["will", "am", "does"], c: 0 },
            { q: "11. What does 'Cure' mean?", a: ["To run very fast.", "To make a sick person healthy.", "To sing a song."], c: 1 },
            { q: "12. What is the short form of 'I will'?", a: ["I'll", "I'm", "I'd"], c: 0 },
            { q: "13. 'When your father ______ to stone.'", a: ["turning", "turns", "turn"], c: 1 },
            { q: "14. How do we make a sentence with 'Will'?", a: ["Subject + Verb + Will", "Will + Verb + Subject", "Subject + Will + Verb"], c: 2 },
            { q: "15. 'Will she go?' -> 'Yes, she ______.'", a: ["will", "goes", "do"], c: 0 }
        ];

        let userAnswers = Array(15).fill(null);
        let solvedCount = 0;

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            const progress = document.getElementById('progress-container');
            
            quizData.forEach((item, idx) => {
                // Create Progress Dot
                const dot = document.createElement('div');
                dot.className = `h-2 flex-1 bg-black border border-gray-800 rounded-full progress-point dot-${idx}`;
                progress.appendChild(dot);

                // Create Card
                const card = document.createElement('div');
                card.className = `question-card rounded-xl p-6 shadow-panel q-card-${idx}`;
                card.innerHTML = `
                    <p class="font-sans text-xl font-bold mb-5 tracking-wide text-white leading-snug">${item.q}</p>
                    <div class="grid grid-cols-1 gap-3 font-sans font-bold text-base">
                        ${item.a.map((opt, oIdx) => `
                            <button class="option-btn border border-top-border text-gray-300 py-4 px-4 rounded-lg text-left flex items-center justify-between group btn-${idx}-${oIdx}" onclick="answer(${idx}, ${oIdx})">
                                <span>${opt}</span>
                                <div class="w-5 h-5 rounded-full border border-gray-600 group-hover:border-top-yellow transition-colors flex items-center justify-center text-xs"></div>
                            </button>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function answer(qIdx, oIdx) {
            if (userAnswers[qIdx] !== null) return; // Locked once answered

            const correct = quizData[qIdx].c;
            const btn = document.querySelector(`.btn-${qIdx}-${oIdx}`);
            const card = document.querySelector(`.q-card-${qIdx}`);
            const dot = document.querySelector(`.dot-${qIdx}`);
            const allBtnsInCard = card.querySelectorAll('.option-btn');

            // Disable all buttons in this card
            allBtnsInCard.forEach(b => b.disabled = true);

            if (oIdx === correct) {
                // Correct
                btn.classList.add('correct');
                btn.classList.remove('text-gray-300', 'bg-top-card');
                btn.querySelector('div').innerHTML = '<i class="fa-solid fa-check"></i>';
                btn.querySelector('div').className = 'w-5 h-5 flex items-center justify-center text-xs border-none text-[#000]';
                userAnswers[qIdx] = true;
            } else {
                // Wrong
                btn.classList.add('wrong');
                btn.classList.remove('text-gray-300', 'bg-top-card');
                btn.querySelector('div').innerHTML = '<i class="fa-solid fa-xmark"></i>';
                btn.querySelector('div').className = 'w-5 h-5 flex items-center justify-center text-xs border-none text-white';
                
                // Highlight correct one too
                const correctBtn = document.querySelector(`.btn-${qIdx}-${correct}`);
                correctBtn.classList.add('correct');
                correctBtn.classList.remove('text-gray-300', 'bg-top-card');
                correctBtn.querySelector('div').innerHTML = '<i class="fa-solid fa-check"></i>';
                correctBtn.querySelector('div').className = 'w-5 h-5 flex items-center justify-center text-xs border-none text-[#000]';
                
                card.classList.add('shake');
                userAnswers[qIdx] = false;
            }

            dot.classList.add('filled');
            solvedCount++;
            updateHeader();
        }

        function updateHeader() {
            const scoreLabel = document.getElementById('score-counter');
            scoreLabel.innerText = `SCORE: ${solvedCount}/15`;
            
            // Visual feedback on header update
            scoreLabel.classList.add('text-white');
            scoreLabel.classList.remove('text-top-yellow');
            setTimeout(() => {
                scoreLabel.classList.remove('text-white');
                scoreLabel.classList.add('text-top-yellow');
            }, 300);
        }

        function checkAllAndSubmit() {
            if (solvedCount < 15) {
                const btn = document.getElementById('submit-btn');
                btn.classList.add('shake', 'bg-red-500', 'text-white');
                btn.classList.remove('bg-top-yellow', 'text-[#000]');
                btn.innerHTML = "INCOMPLETE QUIZ!";
                setTimeout(() => {
                    btn.classList.remove('shake', 'bg-red-500', 'text-white');
                    btn.classList.add('bg-top-yellow', 'text-[#000]');
                    btn.innerHTML = `<i class="fa-solid fa-check-double"></i> FINISH HOMEWORK`;
                }, 1500);
                return;
            }

            // Calculate final score
            const finalCorrect = userAnswers.filter(a => a === true).length;
            const overlay = document.getElementById('success-overlay');
            const badge = document.getElementById('success-badge');
            
            document.getElementById('final-score').innerText = `SCORE: ${finalCorrect} / 15`;
            
            overlay.style.display = 'flex';
            void overlay.offsetWidth;
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                badge.classList.remove('scale-50');
                badge.classList.add('scale-100');
                shootConfetti();
            }, 100);
        }

        function shootConfetti() {
            const container = document.getElementById('app-container');
            const colors = ['#FACC15', '#ffffff', '#a1a1aa'];
            for(let i=0; i<60; i++) {
                let c = document.createElement('div');
                c.className = 'confetti';
                c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                c.style.left = Math.random() * 100 + '%';
                c.style.animation = `fall ${Math.random()*2+2}s linear forwards`;
                c.style.animationDelay = Math.random()*0.5+'s';
                container.appendChild(c);
                setTimeout(() => c.remove(), 4000);
            }
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
